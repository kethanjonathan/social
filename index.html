<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist Panel - CareConnect Uganda</title>
    <link rel="stylesheet" href="../admin/admin-styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'Social Worker' || !localStorage.getItem('staffID')) {
            window.location.href = '../admin-login.html';
        }
    </script>
    <style>
        :root {
            --worker-primary: #0d9488;
        }

        .nav-item:hover,
        .nav-item.active {
            border-left-color: var(--worker-primary) !important;
        }
    </style>
</head>

<body>
    <aside id="adminSidebar">
        <div class="sidebar-header">
            <i data-lucide="heart-pulse" color="#0d9488" size="32"></i>
            <h2 style="margin: 0; font-size: 18px; color: #fff;">Specialist <span style="font-weight: 300;">Panel</span>
            </h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active"><i data-lucide="layout-dashboard" size="18"></i>
                Dashboard</a>
            <a href="#" class="nav-item"><i data-lucide="calendar" size="18"></i> My Bookings</a>
            <a href="#" class="nav-item"><i data-lucide="users" size="18"></i> My Clients</a>
            <a href="#" class="nav-item"><i data-lucide="history" size="18"></i> Session history</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="nav-item"><i data-lucide="log-out" size="18"></i> Logout</a>
        </div>
    </aside>

    <main id="adminMain">
        <header class="admin-header">
            <h1 class="admin-title">Specialist Command</h1>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div style="text-align: right;">
                    <p style="margin: 0; font-weight: 800; font-size: 13px;">Mr. Kamuze Jonathan</p>
                    <p style="margin: 0; font-size: 11px; color: #0d9488;">Specialist</p>
                </div>
                <i data-lucide="user-circle" size="32" color="#666"></i>
            </div>
        </header>

        <div class="admin-content-inner">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(13, 148, 136, 0.1); color: var(--worker-primary);"><i
                            data-lucide="calendar"></i></div>
                    <div class="stat-info">
                        <h3>8</h3>
                        <p>Upcoming Sessions</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(13, 148, 136, 0.1); color: var(--worker-primary);"><i
                            data-lucide="users"></i></div>
                    <div class="stat-info">
                        <h3>42</h3>
                        <p>Assigned Clients</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(13, 148, 136, 0.1); color: var(--worker-primary);"><i
                            data-lucide="check-circle"></i></div>
                    <div class="stat-info">
                        <h3>156</h3>
                        <p>Completed Sessions</p>
                    </div>
                </div>
            </div>

            <div class="admin-card">
                <div class="card-header">
                    <h4>Today's <strong>Schedule</strong></h4>
                </div>
                <div style="padding: 30px;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th>Time</th>
                                <th>Type</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>John Doe</strong></td>
                                <td>10:00 AM</td>
                                <td>Video Call</td>
                                <td><button class="btn-porto"
                                        style="padding: 8px 15px; font-size: 12px; background: var(--worker-primary);">Start
                                        Session</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'Social Worker') {
            window.location.href = '../admin-login.html';
        }
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('userRole');
            localStorage.removeItem('staffID');
            window.location.href = '../admin-login.html';
        }
        lucide.createIcons();
    </script>
</body>

</html>
