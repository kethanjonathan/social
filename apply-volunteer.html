<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration - CareConnect Uganda</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .apply-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 8px;
            color: #444;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }
    </style>
</head>

<body style="background: #f0f2f5;">
    <div class="apply-container">
        <div class="form-header">
            <i data-lucide="heart" color="#e36159" size="48"></i>
            <h2 style="margin: 15px 0 5px;">Join as a <strong>Volunteer</strong></h2>
            <p style="color: #777;">Help us coordinate support and handle community follow-ups.</p>
        </div>

        <form onsubmit="handleVolunteerSubmit(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="yourname@example.com" required>
            </div>
            <div class="form-group">
                <label>Reason for Volunteering</label>
                <textarea placeholder="Tell us why you want to support CareConnect..." style="height: 120px;"
                    required></textarea>
            </div>
            <div class="form-group">
                <label>Availability</label>
                <input type="text" placeholder="e.g. Weekends, 4 hours per week" required>
            </div>

            <button type="submit" class="btn-porto" style="width: 100%; padding: 16px; background: #e36159;">Submit
                Volunteer Application</button>
            <p style="text-align: center; font-size: 12px; color: #888; margin-top: 15px;">Volunteer roles are subject
                to background checks and platform rules.</p>
        </form>
    </div>
    <script>
        function handleVolunteerSubmit(e) {
            e.preventDefault();
            const randomID = Math.floor(3000 + Math.random() * 900);
            const assignedID = `VOL-${randomID}`;

            alert(`Volunteer Application Successful!\n\nYour profile is pending activation. Your login credentials will be:\nRole: Volunteer\nPlatform ID: ${assignedID}\n\nPlease save this ID to use for staff login.`);
            window.location.href = 'index.html';
        }
        lucide.createIcons();
    </script>
</body>

</html>
